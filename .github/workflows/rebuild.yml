name: Rebuild helium-bin

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force a rebuild even if this version was already built"
        type: boolean
        default: false
      version:
        description: "Build a specific upstream version (optional)"
        type: string
        required: false
  repository_dispatch:
    types: [upstream-release]

concurrency:
  group: helium-rebuild
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 30

    steps:
      - name: Install build dependencies
        run: |
          set -euo pipefail
          # Avoid pacman's Landlock sandbox in containers.
          grep -q '^DisableSandbox' /etc/pacman.conf || sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel git curl gnupg python libarchive util-linux \
            pacman-contrib zstd jq github-cli shellcheck namcap bubblewrap \
            alsa-lib at-spi2-core ca-certificates cairo dbus expat gcc-libs glib2 glibc \
            gtk3 hicolor-icon-theme libcups libpulse libva libx11 libxcb libxcomposite \
            libxdamage libxext libxfixes libxkbcommon libxrandr libxss mesa nspr nss pango \
            systemd-libs ttf-liberation xdg-utils desktop-file-utils

      - name: Checkout
        uses: actions/checkout@v4

      - name: Environment
        run: |
          uname -a
          makepkg --version | head -1
          git --version
          gh --version | head -1

      - name: Check upstream and build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HELIUM_FORCE: ${{ inputs.force && '1' || '0' }}
          HELIUM_VERSION: ${{ github.event.client_payload.version || inputs.version }}
        run: |
          set -euo pipefail
          id builder >/dev/null 2>&1 || useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su -m builder -c "cd '$GITHUB_WORKSPACE' && HOME=/home/builder ./scripts/automation/run.sh"

      - name: Resolve artifact
        id: artifact
        run: |
          set -euo pipefail
          if [ ! -f state/status.json ]; then
            echo "result=missing" >> "$GITHUB_OUTPUT"
            echo "No status.json produced; nothing to publish."
            exit 0
          fi
          result="$(python3 -c 'import json;print(json.load(open("state/status.json"))["result"])')"
          echo "result=$result" >> "$GITHUB_OUTPUT"
          if [ "$result" != "success" ]; then
            echo "No new package to publish (result=$result)."
            exit 0
          fi
          version="$(python3 -c 'import json;print(json.load(open("state/status.json"))["latest"])')"
          dir="out/$version"
          pkg="$(ls "$dir"/helium-bin-*.pkg.tar.zst | head -1)"
          ( cd "$dir" && sha256sum "$(basename "$pkg")" > "$(basename "$pkg").sha256" )
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package=$dir/$(basename "$pkg")" >> "$GITHUB_OUTPUT"
          echo "sha256=$dir/$(basename "$pkg").sha256" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        if: steps.artifact.outputs.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: helium-bin-${{ steps.artifact.outputs.version }}
          path: |
            ${{ steps.artifact.outputs.package }}
            ${{ steps.artifact.outputs.sha256 }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: steps.artifact.outputs.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version='${{ steps.artifact.outputs.version }}'
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            exit 0
          fi
          gh release create "$tag" \
            '${{ steps.artifact.outputs.package }}' \
            '${{ steps.artifact.outputs.sha256 }}' \
            --title "helium-bin $version" \
            --notes "Automated Arch Linux package build of helium-bin $version."
