name: Rebuild helium-bin

on:
  schedule:
    # Fallback runs while the host is expected to be on (KST 09:17, 15:17, 21:17).
    # The upstream watcher triggers the build within ~15 minutes during the day.
    - cron: "17 0,6,12 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force a rebuild even if this version was already built"
        type: boolean
        default: false
      version:
        description: "Build a specific upstream version (optional)"
        type: string
        required: false
  repository_dispatch:
    types: [upstream-release]

concurrency:
  group: helium-rebuild
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, arch]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare persistent cache
        run: |
          set -euo pipefail
          cache="$HOME/helium-cache"
          runtime="$HOME/helium-runtime"
          mkdir -p "$cache/out" "$cache/state" "$cache/logs" "$cache/srcdest" "$runtime"
          chmod 700 "$runtime"
          rm -rf out state logs
          ln -s "$cache/out" out
          ln -s "$cache/state" state
          ln -s "$cache/logs" logs
          {
            echo "HELIUM_SRCDEST=$cache/srcdest"
            echo "HELIUM_WORK_ROOT=/tmp/helium-work"
            echo "XDG_RUNTIME_DIR=$runtime"
          } >> "$GITHUB_ENV"

      - name: Environment
        run: |
          uname -a
          makepkg --version | head -1
          git --version

      - name: Check upstream and build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HELIUM_FORCE: ${{ inputs.force && '1' || '0' }}
          HELIUM_VERSION: ${{ github.event.client_payload.version || inputs.version }}
        run: ./scripts/automation/run.sh

      - name: Resolve artifact
        id: artifact
        run: |
          set -euo pipefail
          if [ ! -f state/status.json ]; then
            echo "result=missing" >> "$GITHUB_OUTPUT"
            echo "No status.json produced; nothing to publish."
            exit 0
          fi
          result="$(python3 -c 'import json;print(json.load(open("state/status.json"))["result"])')"
          echo "result=$result" >> "$GITHUB_OUTPUT"
          if [ "$result" != "success" ]; then
            echo "No new package to publish (result=$result)."
            exit 0
          fi
          version="$(python3 -c 'import json;print(json.load(open("state/status.json"))["latest"])')"
          dir="out/$version"
          pkg="$(ls "$dir"/helium-bin-*.pkg.tar.zst | head -1)"
          ( cd "$dir" && sha256sum "$(basename "$pkg")" > "$(basename "$pkg").sha256" )
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package=$dir/$(basename "$pkg")" >> "$GITHUB_OUTPUT"
          echo "sha256=$dir/$(basename "$pkg").sha256" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        if: steps.artifact.outputs.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: helium-bin-${{ steps.artifact.outputs.version }}
          path: |
            ${{ steps.artifact.outputs.package }}
            ${{ steps.artifact.outputs.sha256 }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: steps.artifact.outputs.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version='${{ steps.artifact.outputs.version }}'
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            exit 0
          fi
          gh release create "$tag" \
            '${{ steps.artifact.outputs.package }}' \
            '${{ steps.artifact.outputs.sha256 }}' \
            --title "helium-bin $version" \
            --notes "Automated Arch Linux package build of helium-bin $version."
